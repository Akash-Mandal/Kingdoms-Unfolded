name: Build Android Debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import assets (headless)
        run: godot --headless --path . --import
      - name: Run CE smoke test
        run: godot --headless --path . --script res://scripts/tests/smoke_test.gd

  build-android:
    runs-on: ubuntu-latest
    needs: smoke-test
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import assets (headless)
        run: godot --headless --path . --import
      - name: Point Godot at image templates & SDK settings
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/4.4.stable "$HOME/.local/share/godot/export_templates/" 2>/dev/null || true
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/" 2>/dev/null || true
          echo "--- source templates ---"
          ls -la /root/.local/share/godot/export_templates/4.4.stable/ 2>&1 || echo "SOURCE MISSING"
          echo "--- dest templates ---"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.stable/" 2>&1 || echo "DEST MISSING"
          echo "--- editor settings ---"
          cat "$HOME/.config/godot/editor_settings-4.4.tres" 2>&1 || echo "SETTINGS MISSING"
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/kingdom-eternal-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-eternal-debug-apk
          path: build/kingdom-eternal-debug.apk