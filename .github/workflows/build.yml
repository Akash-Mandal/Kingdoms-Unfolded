name: Build Android Debug APK

on:
  # Cost-saving: NO auto-build on push to main.
  # Pushes do NOT trigger this workflow.
  # To build: Actions tab → "Run workflow", or push a tag "v*".
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Import assets (headless)
        run: godot --headless --path . --import
      - name: Run CE smoke test
        run: timeout 90 godot --headless --path . --script res://scripts/tests/smoke_test.gd

  build-android:
    runs-on: ubuntu-latest
    needs: smoke-test
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Import assets (headless)
        run: godot --headless --path . --import
      - name: Point Godot at image templates & SDK settings
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/" 2>/dev/null || true
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.7.tres "$HOME/.config/godot/" 2>/dev/null || true
          ls "$HOME/.local/share/godot/export_templates/4.7.2.stable/" | grep android || echo "TEMPLATES MISSING"
      - name: Install Android build template into project
        run: |
          mkdir -p android/build
          unzip -o "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip" -d android/build/
          echo "4.7.2.stable" > android/.build_version
          test -f android/build/build.gradle && echo "BUILD TEMPLATE OK" || { echo "BUILD TEMPLATE MISSING"; exit 1; }
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/kingdoms-unfolded-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: kingdoms-unfolded-debug-apk
          path: build/kingdoms-unfolded-debug.apk

  build-release-aab:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then echo "No keystore secret, skipping"; exit 0; fi
          mkdir -p keystore && echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
      - name: Import assets (headless)
        run: godot --headless --path . --import
      - name: Export release AAB
        run: |
          mkdir -p build
          if [ -f keystore/release.keystore ]; then godot --headless --path . --export-release "Android Release" build/kingdoms-unfolded-release.aab; else echo "Skipped: no keystore"; fi
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: kingdoms-unfolded-release-aab
          path: build/kingdoms-unfolded-release.aab